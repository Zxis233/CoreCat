<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoreCat Circuit Blocks</title>
  <link rel="icon" href="svg/corecat_favicon_16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="svg/corecat_favicon_32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="svg/corecat_favicon_64.png" sizes="64x64" type="image/png" />
  <link href="https://fontsapi.zeoseven.com/442/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style"
    crossorigin />
  <noscript>
    <link rel="stylesheet" href="https://fontsapi.zeoseven.com/442/main/result.css" />
  </noscript>
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true">
        <img src="svg/CoreCat_T.png" alt="">
      </div>
      <div class="brand">
        <div class="brand-title">CoreCat Circuit Blocks <span id="commit-hash" class="commit-hash"></span></div>
        <div class="brand-sub"><i>Drag modules, edit ports, connect wires, and fxxk Visio.</i></div>
      </div>
      <div class="actions">
        <div class="dropdown-export">
          <button id="btn-demo-menu" type="button" aria-haspopup="menu" aria-expanded="false"
            aria-controls="menu-demo">Demo</button>
          <div id="menu-demo" class="dropdown-menu" role="menu" aria-labelledby="btn-demo-menu">
            <button id="btn-demo-escuterv" type="button" role="menuitem" tabindex="-1">EsCute</button>
            <button id="btn-demo-lfsr" type="button" role="menuitem" tabindex="-1">LFSR</button>
          </div>
        </div>
        <button id="btn-zoom-out" type="button" aria-label="Zoom out" title="Zoom out">Zoom −</button>
        <button id="btn-zoom-in" type="button" aria-label="Zoom in" title="Zoom in">Zoom +</button>
        <button id="btn-reset-view" type="button" title="Reset zoom and pan">Reset View</button>
        <button id="btn-save" type="button">Save</button>
        <!-- <button id="btn-load">Load</button> -->
        <!-- <button id="btn-import">Import JSON</button>
        <button id="btn-import-module">Import Module</button> -->
        <div class="dropdown-export">
          <button id="btn-import-menu" type="button" aria-haspopup="menu" aria-expanded="false"
            aria-controls="menu-import">Import</button>
          <div id="menu-import" class="dropdown-menu" role="menu" aria-labelledby="btn-import-menu">
            <button id="btn-import-module" type="button" role="menuitem" tabindex="-1">Import Module</button>
            <button id="btn-import" type="button" role="menuitem" tabindex="-1">Import JSON</button>
          </div>
        </div>
        <div class="dropdown-export">
          <button id="btn-export-pic" type="button" aria-haspopup="menu" aria-expanded="false"
            aria-controls="menu-export">Export</button>
          <div id="menu-export" class="dropdown-menu" role="menu" aria-labelledby="btn-export-pic">
            <button id="btn-export-png" type="button" role="menuitem" tabindex="-1">Export PNG</button>
            <button id="btn-export-svg" type="button" role="menuitem" tabindex="-1">Export SVG</button>
            <button id="btn-bg-toggle" type="button" role="menuitem" tabindex="-1">BG: Solid</button>
            <button id="btn-export" type="button" role="menuitem" tabindex="-1">Export JSON</button>
          </div>
        </div>
        <button id="btn-clear" type="button" class="danger">Clear</button>

      </div>
      <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">Ready</div>
      <a class="github-link" href="https://github.com/Zxis233/CoreCat" target="_blank" rel="noopener noreferrer"
        aria-label="GitHub" style="padding: 4px 0 0 0;">
        <img src="svg/github-svgrepo-com.svg" alt="GitHub" width="32" height="32">
      </a>
    </header>
    <div class="layout">
      <aside class="panel palette">
        <h2>Palette</h2>
        <div class="palette-items" aria-label="Module palette">
          <div class="palette-item alu" role="button" tabindex="0" draggable="true" data-type="alu">ALU</div>
          <div class="palette-item reg" role="button" tabindex="0" draggable="true" data-type="reg">Clocked Register</div>
          <div class="palette-item seq" role="button" tabindex="0" draggable="true" data-type="seq">Sequence</div>
          <div class="palette-item combo" role="button" tabindex="0" draggable="true" data-type="combo">Combinational</div>
          <div class="palette-item extender" role="button" tabindex="0" draggable="true" data-type="extender">Extender</div>
          <div class="palette-item mux" role="button" tabindex="0" draggable="true" data-type="mux">MUX</div>
        </div>
        <div class="hint">
          Click a port, then click another port to connect.
          Drag the bend handle to reposition the wire.
        </div>
      </aside>
      <main class="workspace">
        <div id="canvas" class="canvas" role="region" aria-label="Circuit diagram canvas" tabindex="0">
          <svg id="wire-layer" aria-label="Diagram wires"></svg>
          <div id="module-layer" role="group" aria-label="Diagram modules"></div>
        </div>
      </main>
      <aside class="panel properties">
        <h2>Properties</h2>
        <div id="properties-content" class="properties-content"></div>
      </aside>
    </div>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"
    aria-hidden="true" tabindex="-1">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Export</h3>
      </div>
      <textarea id="modal-text" spellcheck="false" aria-label="Diagram JSON"></textarea>
      <div class="modal-actions">
        <button id="modal-copy" type="button" class="primary">Copy</button>
        <button id="modal-close" type="button" class="danger">Close</button>
        <button id="modal-apply" type="button" class="primary">Apply</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
